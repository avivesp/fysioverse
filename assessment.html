<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fysioverse — Decision Lab</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#eef8f4;color:#17312b}.wrap{max-width:900px;margin:auto;padding:28px}.nav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.nav a,.btn{padding:10px 13px;border-radius:11px;background:white;border:1px solid #dbe9e3;font-weight:800;text-decoration:none;color:#28544a}.intro,.q,.result{background:white;border:1px solid #dfeae6;border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 12px 35px #17312b10}.q h2{font-size:19px}.opt{display:block;width:100%;text-align:left;padding:13px;margin:8px 0;border:1px solid #dce8e3;background:#fbfdfc;border-radius:13px;cursor:pointer}.opt:hover{border-color:#20b889;background:#effbf6}.opt input{margin-right:10px}.primary{background:#20b889;color:white;border-color:#20b889}.result{display:none}.meter{height:9px;background:#e6efeb;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#20b889}.small{color:#657871;line-height:1.55}.pill{display:inline-block;background:#dff7ec;color:#127756;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:900;margin:3px}@media(max-width:650px){.wrap{padding:16px}}</style></head><body><main class="wrap"><nav class="nav"><a href="index.html">← Fysioverse</a><div><a href="v8tycoon.html">Play</a> <a href="learning.html">Learning Hub</a></div></nav><div class="intro"><h1>Decision Lab</h1><p class="small">Choose the response you would make as a physiotherapy practice leader. There is no single “perfect manager”. Your profile shows which priorities dominate your reasoning and explains trade-offs to consider.</p><span class="pill">Anonymous</span><span class="pill">No account</span><span class="pill">Automated feedback</span></div><form id="form"></form><button class="btn primary" onclick="score()">Generate my learning profile</button><section class="result" id="result"></section></main><script>const qs=[['A patient cannot comfortably access your entrance. What is your first response?',[['Invest in accessibility and redesign the route','access'],['Adapt the appointment and care process immediately','patient'],['Ask the team to investigate the barrier and options','quality'],['Wait until the next renovation budget','business']]],['Your waiting list is rising while the team is exhausted. What do you prioritise?',[['Protect workload and redesign capacity','people'],['Invest in another treatment room','business'],['Reduce demand by improving triage and appropriate care','quality'],['Keep accepting everyone to protect revenue','business']]],['An insurer offers a contract with more volume but tighter requirements. What do you do?',[['Analyse the contract, quality impact and sustainability','business'],['Accept immediately because volume is good','business'],['Reject it because contracts always limit autonomy','people'],['Discuss the implications with the team and compare alternatives','quality']]],['A hybrid-care pilot could improve access. What is your approach?',[['Pilot it with clear inclusion criteria and evaluate outcomes','digital'],['Move as many patients as possible online','digital'],['Avoid it because digital care is less personal','patient'],['Let staff choose individually without evaluation','people']]],['A junior physiotherapist is clinically strong but struggling with workload. What do you do?',[['Coaching, workload adjustment and a development plan','people'],['Give them more patients so they learn faster','business'],['Replace them if performance drops','business'],['Discuss the causes and agree measurable support','quality']]],['A community partner asks your practice to collaborate. What matters most?',[['Shared patient goals, roles and continuity of care','collaboration'],['Whether it immediately increases revenue','business'],['Whether the partnership can be evaluated','quality'],['Avoid collaboration to keep the clinic independent','people']]],['After an improvement intervention, quality scores did not change. What next?',[['Review the data and adapt the intervention','quality'],['Declare the intervention a failure and stop','quality'],['Increase marketing instead','business'],['Ask patients and staff what they experienced','patient']]],['Which outcome best tells you your practice is sustainable?',[['Financial health together with quality, access and team wellbeing','business'],['Maximum patient volume','business'],['Highest possible reputation score','patient'],['Minimum spending','business']]]];const f=document.getElementById('form');qs.forEach((q,i)=>{let d=document.createElement('section');d.className='q';d.innerHTML='<h2>'+(i+1)+'. '+q[0]+'</h2>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+o[1]+'">'+o[0]+'</label>').join('');f.appendChild(d)});function score(){let totals={access:0,patient:0,quality:0,business:0,people:0,digital:0,collaboration:0},answered=0;qs.forEach((q,i)=>{let x=document.querySelector('input[name=q'+i+']:checked');if(x){totals[x.value]++;answered++}});if(answered<qs.length)return alert('Please answer all 8 scenarios before generating your profile.');let names={access:'Access & inclusion',patient:'Patient-centred care',quality:'Quality improvement',business:'Entrepreneurship',people:'People & leadership',digital:'Digital innovation',collaboration:'Collaboration'};let ranked=Object.entries(totals).sort((a,b)=>b[1]-a[1]);let top=ranked[0], second=ranked[1];let advice={business:'You naturally notice sustainability and organisational trade-offs. Keep testing whether financial decisions also protect quality, access and team wellbeing.',quality:'You strongly favour learning cycles and evidence from practice. Keep translating reflection into measurable changes rather than reflection for its own sake.',patient:'You prioritise the person behind the episode of care. Keep balancing individual needs with access, capacity and sustainable service design.',people:'You recognise that workforce wellbeing is part of practice quality. Keep connecting coaching and workload decisions to patient outcomes.',digital:'You see technology as a possible route to better access. Keep asking who benefits, who may be excluded and how outcomes will be evaluated.',access:'You pay close attention to barriers and inclusion. Keep integrating accessibility into routine practice rather than treating it as an exceptional project.',collaboration:'You see the practice as part of a wider care network. Keep clarifying roles, shared goals and continuity across organisations.'};let html='<h1>Your Fysioverse learning profile</h1><p class="small">You completed '+answered+'/8 scenarios. Your strongest decision pattern is <b>'+names[top[0]]+'</b>, followed by <b>'+names[second[0]]+'</b>.</p>';ranked.forEach(([k,v])=>{let pct=Math.round(v/qs.length*100);html+='<p><b>'+names[k]+'</b> · '+v+' signals</p><div class="meter"><i style="width:'+pct+'%"></i></div>'});html+='<div class="intro"><h2>Personalized feedback</h2><p>'+advice[top[0]]+'</p><p class="small"><b>Next step:</b> play the clinic for at least one in-game year, then repeat the Decision Lab. Compare how your reasoning changes when real consequences, limited resources and competing stakeholder needs are present.</p></div><a class="btn primary" href="v8tycoon.html">Return to the clinic →</a>';let r=document.getElementById('result');r.innerHTML=html;r.style.display='block';r.scrollIntoView({behavior:'smooth'})}</script></body></html>
