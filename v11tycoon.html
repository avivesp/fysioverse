<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fysioverse Tycoon — Chapter 1</title><script src="https://cdn.babylonjs.com/babylon.js"></script><style>:root{--ink:#17262a;--mut:#66777b;--g:#22bd90;--p:#e7f8f1;--gold:#efbd4e;--blue:#69aef1;--line:#dce9e4}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#cce9df}button{font:inherit;cursor:pointer}.world,canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:10;top:10px;left:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}.chip,.panel,.bottom{background:#fffffff2;border:1px solid #fff;border-radius:15px;box-shadow:0 12px 35px #17312b1c;backdrop-filter:blur(8px)}.logo{padding:10px 13px;font-weight:1000;letter-spacing:.08em}.logo b{color:#14916c}.chip{padding:6px 10px;min-width:70px}.chip small{display:block;color:var(--mut);font-size:8px;text-transform:uppercase}.chip strong{font-size:13px}.day{margin-left:auto;padding:9px 11px;font-weight:950;font-size:12px}.side{position:fixed;z-index:10;top:78px;bottom:82px;width:258px;overflow:auto}.left{left:12px}.right{right:12px}.panel{overflow:hidden;margin-bottom:9px}.head{padding:11px 13px;border-bottom:1px solid #e7ece9;font-weight:950}.body{padding:11px 13px}.small{font-size:11px;color:var(--mut);line-height:1.45}.mission{padding:12px;border-radius:12px;background:#e9f8f2;border:1px solid #b8e7d6}.mission b{display:block}.reward{color:#a16a00;font-weight:950}.meter{height:7px;background:#e8eeea;border-radius:99px;overflow:hidden;margin:4px 0 8px}.meter i{display:block;height:100%;background:var(--g)}.action{display:block;width:100%;border:0;border-radius:11px;background:#fff;padding:10px;margin:5px 0;text-align:left;font-weight:900;border:1px solid var(--line)}.action:hover{background:var(--p);color:#087452}.primary{background:var(--g)!important;color:#fff!important;border-color:var(--g)}.gold{background:#fff3d9!important}.blue{background:#edf6ff!important}.build{display:grid;grid-template-columns:1fr 1fr;gap:5px}.build button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-weight:850;text-align:left}.build button:disabled{opacity:.38;cursor:not-allowed}.bottom{position:fixed;z-index:11;left:50%;bottom:10px;transform:translateX(-50%);padding:7px;display:flex;gap:5px;align-items:center}.bottom button{border:0;border-radius:10px;background:#fff;padding:9px 12px;font-weight:900}.toast{position:fixed;z-index:60;left:50%;bottom:72px;transform:translateX(-50%);display:none;padding:11px 15px;border-radius:12px;background:#17262a;color:white;font-weight:900;box-shadow:0 15px 35px #0004}.toast.good{background:#087452}.modalbg{position:fixed;inset:0;z-index:40;background:#10282a88;backdrop-filter:blur(4px);display:none}.modalbg.on{display:block}.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 26px));max-height:calc(100vh - 26px);overflow:auto;background:#fffdf8;border-radius:22px;box-shadow:0 35px 90px #102b2440;display:none}.modal.on{display:block}.mtop{padding:20px 22px;background:linear-gradient(135deg,#e1f8ee,#fbfff9);border-bottom:1px solid #e4ebe7}.mbody{padding:18px 22px}.close{position:absolute;right:9px;top:9px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:22px}.choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;margin:7px 0;text-align:left}.choice:hover{border-color:var(--g);background:#f3fcf8}.choice b{display:block}.choice span{display:block;font-size:10px;color:var(--mut);margin-top:4px}.float{position:fixed;z-index:8;display:none;background:#fff;border-radius:10px;padding:6px 9px;font-size:10px;font-weight:950;box-shadow:0 8px 20px #0002;pointer-events:none}@media(max-width:720px){.side{display:none}.top{left:7px;right:7px}.chip:nth-of-type(n+4){display:none}.day{display:none}.bottom{left:7px;right:7px;transform:none;overflow:auto;justify-content:flex-start}.bottom button{white-space:nowrap}}</style></head><body><div class="world"><canvas id="c"></canvas></div><div class="top"><div class="logo">FYSIO<b>VERSE</b></div><div class="chip"><small>Cash</small><strong id="cash"></strong></div><div class="chip"><small>Patients</small><strong id="patients"></strong></div><div class="chip"><small>XP</small><strong id="xp"></strong></div><div class="chip"><small>Reputation</small><strong id="rep"></strong></div><div class="chip"><small>Team</small><strong id="team"></strong></div><div class="day" id="day"></div></div><aside class="side left"><div class="panel"><div class="head">⭐ Next mission</div><div class="body" id="mission"></div></div><div class="panel"><div class="head">Practice health</div><div class="body"><div class="small">Quality</div><div class="meter"><i id="quality"></i></div><div class="small">Access</div><div class="meter"><i id="access"></i></div><div class="small">Team wellbeing</div><div class="meter"><i id="well"></i></div></div></div><div class="panel"><div class="head">Build & grow</div><div class="body build" id="build"></div></div></aside><aside class="side right"><div class="panel"><div class="head">Today's clinic</div><div class="body" id="status"></div><div class="body"><button class="action primary" onclick="treat()">🩺 Treat next patient <span id="treatcost"></span></button><button class="action gold" onclick="endDay()">☀️ Finish day</button><button class="action blue" onclick="eventCard()">💭 New practice situation</button></div></div><div class="panel"><div class="head">Activity</div><div class="body" id="log" style="max-height:150px;overflow:auto"></div></div></aside><div class="bottom"><button onclick="focusClinic()">🏥 Clinic</button><button onclick="openTeam()">👥 Team</button><button onclick="openQuality()">🧭 Quality</button><button onclick="resetGame()">↻ New game</button></div><div class="toast" id="toast"></div><div class="modalbg" id="bg"></div><section class="modal" id="modal"><button class="close" onclick="closeModal()" aria-label="Close">×</button><div class="mtop"><div class="small" id="mk"></div><h2 id="mt" style="margin:4px 0"></h2><div class="small" id="md"></div></div><div class="mbody" id="mb"></div></section><script>const B=BABYLON,$=id=>document.getElementById(id),KEY='fysioverse-v11';let fresh=!localStorage.getItem(KEY);let s={cash:50000,patients:8,xp:0,quality:78,access:65,well:86,rep:45,innovation:8,day:1,week:1,year:1,rooms:{treatment:1,reception:false,gym:false,hybrid:false,access:false},staff:[{name:'Sanne',role:'Physio',mood:86}],treatments:0,builds:0,done:[],log:['🌅 Day 1 — welcome to your new practice.'],queue:[]};try{if(!fresh)Object.assign(s,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const clamp=()=>{['quality','access','well','rep','innovation'].forEach(k=>s[k]=Math.max(0,Math.min(100,s[k])));s.cash=Math.max(0,s.cash);s.patients=Math.max(0,Math.min(80,Math.round(s.patients)));s.xp=Math.max(0,s.xp)};function note(x){s.log.push(x);if(s.log.length>60)s.log.shift()}function pop(x,c=''){let e=$('toast');e.textContent=x;e.className='toast '+c;e.style.display='block';clearTimeout(window.t);window.t=setTimeout(()=>e.style.display='none',2200)}function capacity(){return s.rooms.treatment*4+(s.rooms.gym?4:0)+(s.rooms.hybrid?3:0)}function level(){return Math.floor(s.xp/100)+1}function missions(){return[['first','Treat your first patient',s.treatments>=1,'Treat a patient',50],['room','Build room #2',s.rooms.treatment>=2,'Add a treatment room',75],['five','Serve 5 patients',s.treatments>=5,'Keep treating',100],['access','Reach 75% access',s.access>=75,'Build access or adapt',100],['team','Hire a colleague',s.staff.length>=2,'Hire your first colleague',125],['gym','Open the exercise gym',s.rooms.gym,'Build the gym',125],['quality','Reach 82% quality',s.quality>=82,'Improve your system',150],['hybrid','Unlock Hybrid Care',s.rooms.hybrid,'Build Hybrid Care',175],['rep','Reach 65% reputation',s.rep>=65,'Grow community trust',250]]}function check(){missions().forEach(m=>{if(m[2]&&!s.done.includes(m[0])){s.done.push(m[0]);s.xp+=m[4];note('🏆 Mission complete: '+m[1]+' · +'+m[4]+' XP');pop('MISSION COMPLETE · '+m[1],'good')}})}function sync(){clamp();$('cash').textContent='€'+Math.round(s.cash).toLocaleString('nl-NL');$('patients').textContent=s.patients;$('xp').textContent=s.xp+' · L'+level();$('rep').textContent=Math.round(s.rep)+'%';$('team').textContent=Math.round(s.well)+'%';$('day').textContent=`YEAR ${s.year} · WEEK ${s.week} · DAY ${s.day}`;$('quality').style.width=s.quality+'%';$('access').style.width=s.access+'%';$('well').style.width=s.well+'%';let m=missions().find(x=>!x[2]);$('mission').innerHTML=m?`<div class="mission"><b>${m[1]}</b><span class="small">${m[3]}</span><div class="reward">+${m[4]} XP</div></div>`:`<div class="mission"><b>🎉 Chapter 1 complete</b><span class="small">Your clinic is ready for a bigger challenge.</span></div>`;let buys=[['treatment','🛏️ Room #'+(s.rooms.treatment+1),'€6,000',s.rooms.treatment<4],['reception','🛎️ Reception','€3,500',!s.rooms.reception],['gym','🏋️ Exercise gym','€8,500',!s.rooms.gym],['hybrid','💻 Hybrid Care','€7,000',!s.rooms.hybrid],['access','♿ Access upgrade','€2,200',!s.rooms.access],['hire','👤 Hire colleague','€3,200',s.staff.length<5]];$('build').innerHTML=buys.map(b=>`<button ${b[3]?'':'disabled'} onclick="${b[0]==='hire'?'hire()':`build('${b[0]}')`}">${b[1]}<br><span class="small">${b[2]}</span></button>`).join('');let cap=capacity(),load=Math.min(100,Math.round(s.patients/Math.max(1,cap)*100));$('status').innerHTML=`<b>${s.patients} patients waiting</b><p class="small">${cap} daily capacity · ${s.staff.length} team member${s.staff.length>1?'s':''}</p><div class="meter"><i style="width:${Math.min(100,load)}%;background:${load>90?'#d85d67':'var(--g)'}"></i></div><span class="small">Clinic load: ${load}%</span>`;$('log').innerHTML=s.log.slice(-10).reverse().map(x=>`<div class="small" style="padding:5px 0;border-bottom:1px solid #edf0ee">${x}</div>`).join('');save();render()}function spend(n,msg){if(s.cash<n){pop('Not enough cash yet. Treat patients first.');return false}s.cash-=n;note(msg);return true}function treat(){if(!s.patients){pop('No patients waiting — nice problem to have!');return}let cap=capacity();if(!cap){pop('Build a treatment room first.');return}s.patients--;s.treatments++;let rev=s.rooms.hybrid?112:95;s.cash+=rev;s.quality+=.8;s.rep+=.35;s.well-=.25;note(`🩺 Patient treated · +€${rev}`);s.xp+=15;check();sync();pop(`Patient treated · +€${rev} · +15 XP`,'good');animatePatient()}function build(t){let cost={treatment:6000,reception:3500,gym:8500,hybrid:7000,access:2200}[t];if(!spend(cost,'🏗️ Built '+t+'.'))return;if(t==='treatment'){s.rooms.treatment++;s.quality+=2;s.patients+=1}if(t==='reception')s.rooms.reception=true;if(t==='gym'){s.rooms.gym=true;s.quality+=4;s.innovation+=3}s.access+=t==='access'?12:0;if(t==='access'){s.rooms.access=true;s.quality+=1}if(t==='hybrid'){s.rooms.hybrid=true;s.access+=5;s.innovation+=10;s.quality+=2;note('💻 Hybrid Care unlocked — digital appointments now fit into your pathway.')}s.builds++;s.xp+=25;check();sync();pop('New space built · +25 XP','good')}function hire(){if(s.staff.length>=5)return; if(!spend(3200,'👥 Hired a new colleague.'))return;let names=['Noor','Daan','Lotte','Ravi'];s.staff.push({name:names[s.staff.length-1],role:'Physio',mood:76});s.well-=3;s.xp+=35;check();sync();pop('New colleague joined · +35 XP','good')}function endDay(){let cap=Math.min(capacity(),s.staff.length*4);let n=Math.min(cap,s.patients);let rev=n*(s.rooms.hybrid?112:95)+(s.rooms.reception?80:0);let cost=180+s.staff.length*150;let net=rev-cost;s.cash+=net;s.patients-=n;s.quality+=n>cap*.9?-2:1;s.well+=n>cap*.9?-5:1;s.rep+=n?1:-.5;s.patients+=Math.max(1,Math.round((s.rep-40)/20)+Math.round(s.access/55));s.day++;note(`🌙 Day closed · ${n} sessions · ${net>=0?'+':''}€${Math.round(net)}`);if(s.day>5){s.day=1;s.week++;note('📅 Week complete — review the balance between care, people and growth.')}if(s.week>12){s.week=1;s.year++;note('🎉 New practice year!')}check();sync();pop(`${n} patients served · ${net>=0?'+':''}€${Math.round(net)}`,'good');if(s.day===2&&s.week===1&&s.year===1&&!s.done.includes('room'))coach()}const situations=[['A patient says the entrance is difficult to navigate.','Build access · €2,200 · +12 access · +1 quality',()=>{if(spend(2200,'♿ Improved physical access.')){s.access+=12;s.quality+=1;closeModal();sync();pop('Access improved','good')}} ,['Adapt the workflow · +4 access · -1 wellbeing',()=>{s.access+=4;s.well-=1;closeModal();sync();pop('Workflow adapted','good')}]],['Your team says the schedule is too full.','Protect wellbeing · €700 · +8 wellbeing · +1 quality',()=>{if(spend(700,'🧘 Protected wellbeing time.')){s.well+=8;s.quality+=1;closeModal();sync();pop('Breathing room created','good')}} ,['Push through · -7 wellbeing · -3 quality',()=>{s.well-=7;s.quality-=3;closeModal();sync();pop('Short-term output, long-term cost','')}}],['A partner asks about a hybrid pathway.','Prototype carefully · €1,500 · +9 innovation · +3 access',()=>{if(spend(1500,'💻 Prototyped a hybrid pathway.')){s.innovation+=9;s.access+=3;closeModal();sync();pop('Prototype launched','good')}} ,['Wait and learn · +2 quality',()=>{s.quality+=2;closeModal();sync();pop('You chose to learn first','good')}]]];function eventCard(){let e=situations[Math.floor(Math.random()*situations.length)];$('mk').textContent='PRACTICE SITUATION';$('mt').textContent=e[0];$('md').textContent='Choose a response. Every choice has a trade-off.';$('mb').innerHTML=`<button class="choice" onclick="window.a[0][1]()"><b>${e[1]}</b><span>Invest now to change the system.</span></button><button class="choice" onclick="window.a[1][1]()"><b>${e[2][0]}</b><span>Use your existing resources instead.</span></button>`;window.a=[[e[1],e[2]],[e[2][0],e[3]]];showModal()}function coach(){showModal();$('mk').textContent='DAY 2 · COACH';$('mt').textContent='You have started. Now think like an owner.';$('md').textContent='Good tycoon decisions balance care, capacity, people and sustainability.';$('mb').innerHTML=`<div class="small" style="font-size:13px">Your next milestone is to build treatment room #2. But you do not have to rush. Watch workload and quality as you grow.</div><button class="action primary" onclick="closeModal()">Let's play →</button>`}function openTeam(){showModal();$('mk').textContent='TEAM';$('mt').textContent='People are part of the practice.';$('md').textContent='Growth without wellbeing creates a fragile clinic.';$('mb').innerHTML=s.staff.map(x=>`<div class="mission" style="margin:6px 0"><b>${x.name}</b><span class="small">${x.role} · mood ${Math.round(x.mood)}%</span></div>`).join('')+`<button class="action primary" onclick="hire();closeModal()">Hire · €3,200</button>`}function openQuality(){showModal();$('mk').textContent='QUALITY';$('mt').textContent='Run the improvement cycle';$('md').textContent='Identify → intervene → measure → reflect → adapt.';$('mb').innerHTML=`<div class="small">Current quality: <b>${Math.round(s.quality)}%</b></div><button class="action primary" onclick="qualityCycle()">Run improvement cycle · €900</button><div class="small" style="margin-top:12px">Use situations to practise trade-offs instead of chasing a single score.</div>`}function qualityCycle(){if(spend(900,'🧭 Quality improvement cycle completed.')){s.quality+=5;s.rep+=2;s.xp+=20;check();closeModal();sync();pop('Quality improved · +20 XP','good')}}function focusClinic(){closeModal();cam.target.set(0,0,0);cam.radius=23}function animatePatient(){if(!window.people.length)return;let p=window.people[Math.floor(Math.random()*window.people.length)];let from=p.position.clone();p.position.x+=2;p.position.z-=1;setTimeout(()=>{p.position.copy(from)},500)}function resetGame(){if(confirm('Start a new Fysioverse clinic? Your current local save will be replaced.')){localStorage.removeItem(KEY);location.reload()}}function showModal(){$('bg').classList.add('on');$('modal').classList.add('on')}function closeModal(){$('bg').classList.remove('on');$('modal').classList.remove('on')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});let scene,cam,people=[];function setup(){let c=$('c'),eng=new B.Engine(c,true,{preserveDrawingBuffer:true,stencil:true});scene=new B.Scene(eng);scene.clearColor=B.Color4.FromHexString('#cce9dfff');cam=new B.ArcRotateCamera('cam',-Math.PI/2.35,1.02,23,new B.Vector3(0,0,0),scene);cam.lowerRadiusLimit=14;cam.upperRadiusLimit=34;cam.attachControl(c,true);cam.wheelPrecision=65;let light=new B.HemisphericLight('h',new B.Vector3(0,1,0),scene);light.intensity=1;let ground=B.MeshBuilder.CreateGround('ground',{width:60,height:60},scene);ground.material=mat('#91cdb8');render();eng.runRenderLoop(()=>scene.render());addEventListener('resize',()=>eng.resize())}function mat(c){let m=new B.StandardMaterial('m'+c,scene);m.diffuseColor=B.Color3.FromHexString(c);return m}function box(n,x,z,w,d,h,m){let o=B.MeshBuilder.CreateBox(n,{width:w,depth:d,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}function cyl(n,x,z,r,h,m){let o=B.MeshBuilder.CreateCylinder(n,{diameter:r*2,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}function render(){if(!scene)return;scene.meshes.slice().forEach(m=>{if(m.name!=='ground')m.dispose()});people=[];let wall=mat('#f8fbfa'),floor=mat('#d9eee6'),green=mat('#35c99b'),pink=mat('#ef7f9e'),blue=mat('#6aaef2'),wood=mat('#b98259'),dark=mat('#35504a'),hy=mat('#b9d8f5'),gold=mat('#c8a96b');box('floor',0,0,15,11,.15,floor);box('back',0,-5.5,15,.25,3.2,wall);box('left',-7.5,0,.25,11,3.2,wall);for(let i=0;i<s.rooms.treatment;i++){let x=-5+i*3.2;box('room',x,-1.8,2.7,3.3,.18,green);box('bed',x,-1.7,1.7,.7,.25,wood);people.push(cyl('patient',x,-2.5,.24,.65,pink));people.push(cyl('staff',x-.7,-1.4,.2,.8,blue))}if(s.rooms.reception){box('desk',-4,3.2,4,1,.9,wood);cyl('plant',-5,3.8,.25,.8,green)}if(s.rooms.gym){box('gym',4,2.5,5,3,.18,blue);for(let i=0;i<4;i++)cyl('mat',2.5+i*1.2,2.2,.35,.12,green)}if(s.rooms.hybrid){box('hybrid',4,0,3.5,2.2,.18,hy);box('screen',4,0,1.6,.12,1.1,dark);cyl('chair',4.8,.6,.3,.6,blue)}if(s.rooms.access)box('ramp',-6.3,3.8,2.2,1.3,.15,gold);for(let i=0;i<Math.min(s.staff.length,5);i++)people.push(cyl('person',-5+i*2,4.3,.28,.9,i%2?blue:pink))}setup();sync();if(fresh)setTimeout(()=>{showModal();$('mk').textContent='DAY 1 · WELCOME';$('mt').textContent='Your first clinic is ready.';$('md').textContent='Learn by doing. One small decision at a time.';$('mb').innerHTML=`<div class="small" style="font-size:13px">You have <b>€50,000</b>, one treatment room and a small queue of patients. Your first mission is simple: treat your first patient.</div><button class="action primary" onclick="closeModal();pop('Your first move: treat a patient →','good')">Start Day 1 →</button>`},450)</script></body></html>
