<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fysioverse — Play</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9eee7;font-family:Inter,system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#d9eee7}
#cloud{position:fixed;z-index:100;right:14px;bottom:14px;padding:8px 11px;border-radius:999px;background:#ffffffed;border:1px solid #fff;box-shadow:0 8px 25px #17312b1c;color:#49635d;font-size:11px;font-weight:850;transition:opacity .4s}
#cloud.ok{color:#087452}#cloud.warn{color:#9a6500}#cloud.err{color:#a43f4a}
</style>
</head>
<body>
<div id="cloud" class="warn">☁ Connecting cloud save…</div>
<iframe id="game" title="Fysioverse Tycoon"></iframe>
<script src="https://unpkg.com/convex@1.25.4/dist/browser.bundle.js"></script>
<script>
(() => {
  const CONVEX_URL = "https://calm-lion-683.convex.cloud";
  const KEY = "fysioverse-v11";
  const SESSION_KEY = "fysioverse-cloud-session";
  const status = document.getElementById("cloud");
  const frame = document.getElementById("game");
  const client = new convex.ConvexClient(CONVEX_URL);
  const api = convex.anyApi;
  const setStatus = (text, cls) => { status.textContent = text; status.className = cls || ""; };
  const getSession = () => {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : "session-" + Date.now() + "-" + Math.random().toString(36).slice(2));
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  };
  const sessionId = getSession();
  let lastSent = null;
  let pending = false;
  let started = false;

  async function boot() {
    try {
      const remote = await client.query(api.gameSessions.get, { sessionId });
      const local = localStorage.getItem(KEY);
      if (!local && remote && remote.state) {
        localStorage.setItem(KEY, JSON.stringify(remote.state));
      }
      setStatus(remote ? "☁ Cloud save ready" : "☁ Cloud save ready · new practice", "ok");
    } catch (e) {
      console.warn("Convex load failed", e);
      setStatus("☁ Local save · cloud retrying", "warn");
    }
    frame.src = "v11tycoon.html";
    started = true;
  }

  async function sync() {
    if (!started || pending) return;
    const raw = localStorage.getItem(KEY);
    if (!raw || raw === lastSent) return;
    let state;
    try { state = JSON.parse(raw); } catch { return; }
    pending = true;
    try {
      await client.mutation(api.gameSessions.save, { sessionId, state, updatedAt: Date.now() });
      lastSent = raw;
      setStatus("☁ Saved", "ok");
      clearTimeout(window.cloudFade);
      window.cloudFade = setTimeout(() => setStatus("☁ Cloud save", "ok"), 1200);
    } catch (e) {
      console.warn("Convex save failed", e);
      setStatus("☁ Local save · retrying", "warn");
    } finally { pending = false; }
  }

  boot();
  setInterval(sync, 1800);
  window.addEventListener("beforeunload", () => { sync(); });
})();
</script>
</body>
</html>
