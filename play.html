<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fysioverse — Play</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9eee7;font-family:Inter,system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#d9eee7}
#cloud{position:fixed;z-index:100;right:14px;bottom:14px;padding:8px 11px;border-radius:999px;background:#ffffffed;border:1px solid #fff;box-shadow:0 8px 25px #17312b1c;color:#49635d;font-size:11px;font-weight:850;transition:opacity .4s}
#cloud.ok{color:#087452}#cloud.warn{color:#9a6500}
</style>
</head>
<body>
<div id="cloud" class="warn">☁ Local save ready</div>
<iframe id="game" title="Fysioverse Tycoon" src="v11tycoon.html"></iframe>
<script src="https://unpkg.com/convex@1.25.4/dist/browser.bundle.js" defer></script>
<script>
(() => {
  const CONVEX_URL = "https://calm-lion-683.convex.cloud";
  const KEY = "fysioverse-v11";
  const SESSION_KEY = "fysioverse-cloud-session";
  const status = document.getElementById("cloud");
  const setStatus = (text, cls) => { status.textContent = text; status.className = cls || ""; };
  const sessionId = (() => {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : "session-" + Date.now() + "-" + Math.random().toString(36).slice(2));
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  })();

  async function cloudSync() {
    if (!window.convex || !window.convex.ConvexClient || !window.convex.anyApi) {
      setStatus("☁ Local save · cloud unavailable", "warn");
      return;
    }
    try {
      const client = new convex.ConvexClient(CONVEX_URL);
      const api = convex.anyApi;
      const remote = await client.query(api.gameSessions.get, {sessionId});
      const local = localStorage.getItem(KEY);
      if (!local && remote && remote.state) localStorage.setItem(KEY, JSON.stringify(remote.state));
      setStatus(remote ? "☁ Cloud save ready" : "☁ Cloud save ready · new practice", "ok");
      let lastSent = localStorage.getItem(KEY) || "";
      setInterval(async () => {
        const raw = localStorage.getItem(KEY);
        if (!raw || raw === lastSent) return;
        try {
          await client.mutation(api.gameSessions.save, {sessionId, state:JSON.parse(raw), updatedAt:Date.now()});
          lastSent = raw;
          setStatus("☁ Saved", "ok");
          setTimeout(() => setStatus("☁ Cloud save", "ok"), 1200);
        } catch { setStatus("☁ Local save · retrying", "warn"); }
      }, 2000);
    } catch (e) {
      console.warn("Optional cloud save unavailable:", e);
      setStatus("☁ Local save · game fully playable", "warn");
    }
  }

  window.addEventListener("load", () => setTimeout(cloudSync, 700));
})();
</script>
</body>
</html>
