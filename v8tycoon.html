<script>
const B=BABYLON,$=x=>document.getElementById(x),KEY='fysioverse-v10';let fresh=!localStorage.getItem(KEY);let s={cash:50000,patients:8,xp:0,level:1,quality:78,access:65,well:86,rep:45,innovation:8,day:1,week:1,year:1,rooms:{treatment:1,reception:false,gym:false,hybrid:false,access:false},staff:[{name:'Sanne',role:'Physio',mood:86}],marketing:0,log:['🌅 Day 1: You unlock the clinic.'],done:[],treatments:0,builds:0};try{if(!fresh)Object.assign(s,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const clamp=()=>{['quality','access','well','rep','innovation'].forEach(k=>s[k]=Math.max(0,Math.min(100,s[k])));s.cash=Math.max(0,s.cash);s.patients=Math.max(0,Math.min(80,Math.round(s.patients)));s.xp=Math.max(0,s.xp);s.level=Math.floor(s.xp/100)+1};function note(x){s.log.push(x);if(s.log.length>60)s.log.shift()}function toast(x,c=''){let e=$('toast');e.textContent=x;e.className='toast '+c;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2400)}function reward(x,label){s.xp+=x;toast(`+${x} XP · ${label}`,'good');checkMilestones()}function sync(){clamp();$('cash').textContent='€'+Math.round(s.cash).toLocaleString('nl-NL');$('patients').textContent=s.patients;$('xp').textContent=s.xp+' · L'+s.level;$('rep').textContent=Math.round(s.rep)+'%';$('team').textContent=Math.round(s.well)+'%';$('day').textContent=`YEAR ${s.year} · WEEK ${s.week} · DAY ${s.day}`;$('well').style.width=s.well+'%';$('access').style.width=s.access+'%';$('qualitybar').style.width=s.quality+'%';$('log').innerHTML=s.log.slice(-10).reverse().map(x=>'<div>'+x+'</div>').join('');quests();save()}
function questList(){return[
['first','Treat your first patient',s.treatments>=1,'Use Treat a patient',50],
['room','Build treatment room #2',s.rooms.treatment>=2,'Buy your next room',75],
['queue','Serve 5 patients',s.treatments>=5,'Keep treating patients',100],
['access','Make the clinic accessible',s.access>=75,'Build Access or adapt your workflow',100],
['team','Hire your first colleague',s.staff.length>=2,'Grow your team',125],
['gym','Open an exercise gym',s.rooms.gym,'Build the Gym',125],
['quality','Reach 82% quality',s.quality>=82,'Improve your quality system',150],
['hybrid','Unlock Hybrid Care',s.rooms.hybrid,'Build Hybrid Care',175],
['rep','Become a trusted local clinic',s.rep>=65,'Build reputation to 65%',250]
]}
function quests(){let q=questList(),first=q.find(x=>!x[2]);$('quests').innerHTML=(first?`<div class="coach"><b>Next:</b> ${first[1]}<br><span style="font-size:10px">${first[3]}</span></div>`:'<div class="coach"><b>🎉 Chapter complete!</b><br><span style="font-size:10px">Your clinic is ready for the next challenge.</span></div>')+q.map(x=>`<div class="quest ${x[2]?'done':''} ${x===first?'active':''}"><span class="reward">+${x[4]} XP</span><b>${x[2]?'✓':'○'} ${x[1]}</b><span>${x[3]}</span></div>`).join('')}
function checkMilestones(){questList().forEach(x=>{if(x[2]&&!s.done.includes(x[0])){s.done.push(x[0]);s.xp+=x[4];note(`🏆 Mission complete: ${x[1]} · +${x[4]} XP`);toast(`MISSION COMPLETE · ${x[1]}`,'good')}});sync()}
function tab(b,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let titles={overview:'Clinic overview',patients:'Patient demand',team:'Your team',business:'Business control',quality:'Quality improvement',innovation:'Innovation lab'};$('rtitle').textContent=titles[n];let h='';if(n==='overview')h=`<b>Build a practice, one mission at a time.</b><p class="small">Start with care. Earn money. Reinvest. Grow your people and quality. New systems unlock as your clinic develops.</p><div class="tip">🎮 <b>Your first move:</b> treat a patient. The game will guide you from there.</div>`;if(n==='patients')h=`<b>${s.patients} patients waiting</b><p class="small">Your demand grows with reputation, access and community outreach. Capacity is limited by rooms and staff.</p><div class="grid"><div class="mini"><b>${capacity()}</b><span>daily room capacity</span></div><div class="mini"><b>${s.staff.length*4}</b><span>team capacity</span></div></div>`;if(n==='team')h=s.staff.map(x=>`<div class="mini" style="margin:5px 0"><b>${x.name}</b><span>${x.role} · mood ${Math.round(x.mood)}%</span></div>`).join('')+`<button class="action primary" onclick="hire()">Hire colleague · €3,200</button><button class="action" onclick="train()">Team training · €1,100</button>`;if(n==='business')h=`<b>Practice economy</b><p class="small">Revenue comes from care. Costs come from staffing and running the clinic. Reinvest when it helps the system, not just one number.</p><div class="grid"><div class="mini"><b>€${Math.round(s.cash).toLocaleString('nl-NL')}</b><span>cash</span></div><div class="mini"><b>${s.rep}%</b><span>reputation</span></div></div>`;if(n==='quality')h=`<b>Quality cycle</b><p class="small">Identify → intervene → measure → reflect → adapt.</p><button class="action primary" onclick="improve()">Run improvement cycle · €900</button>`;if(n==='innovation')h=`<b>Innovation lab</b><p class="small">Digital care can improve access, but only when the workflow is safe, useful and sustainable.</p><button class="action blue" onclick="innovate()">Prototype service · €1,500</button>`;$('info').innerHTML=h}
function capacity(){return s.rooms.treatment*4+(s.rooms.gym?4:0)+(s.rooms.hybrid?3:0)}function spend(c,msg){if(s.cash<c){toast('Not enough cash yet — treat patients first.','bad');return false}s.cash-=c;note(msg);return true}
function unlocked(t){let rules={reception:s.treatments>=1,gym:s.rooms.treatment>=2,hybrid:s.quality>=80&&s.innovation>=15,access:true,hire:s.treatments>=3,train:s.staff.length>=2,market:s.rep>=50};return rules[t]!==false}
function build(t){let costs={treatment:6000,reception:3500,gym:8500,hybrid:7000,access:2200};if(!unlocked(t))return toast('Complete your current mission first.','bad');if(t==='treatment'&&s.rooms.treatment>=4)return toast('Maximum treatment rooms reached for this clinic.');if(t!=='treatment'&&s.rooms[t])return toast('Already built.');if(!spend(costs[t],`🏗️ Built ${t}.`))return;s.builds++;if(t==='treatment'){s.rooms.treatment++;s.quality+=2;s.patients+=1;reward(30,'new capacity')}if(t==='reception'){s.rooms.reception=true;s.access+=3;reward(25,'welcoming reception')}if(t==='gym'){s.rooms.gym=true;s.quality+=4;s.innovation+=3;reward(60,'exercise gym')}if(t==='hybrid'){s.rooms.hybrid=true;s.innovation+=10;s.access+=5;s.quality+=2;reward(80,'hybrid care');note('💻 Hybrid Care is now part of your patient journey. Existing rooms remain intact.')}if(t==='access'){s.rooms.access=true;s.access+=12;s.quality+=1;reward(40,'accessibility')}renderClinic();sync();toast('✨ New clinic space built!','good')}
function hire(){if(!unlocked('hire'))return toast('Treat 3 patients to unlock hiring.','bad');if(s.staff.length>=5)return toast('Your practice is fully staffed for now.');if(!spend(3200,'🧑‍⚕️ Hired a colleague.'))return;let names=['Noor','Daan','Lotte','Ravi'];s.staff.push({name:names[s.staff.length-1]||'Mila',role:'Junior physio',mood:76});s.well-=3;reward(55,'team growth');renderClinic();sync();toast('👋 New colleague joined!','good')}
function train(){if(!unlocked('train'))return toast('Hire a colleague first.','bad');if(!spend(1100,'🎓 Team development session.'))return;s.staff.forEach(x=>x.mood=Math.min(100,x.mood+5));s.well+=5;s.quality+=2;s.innovation+=2;reward(35,'team learning');sync();toast('🎓 Team learned together.','good')}
function market(){if(!unlocked('market'))return toast('Reach 50% reputation first.','bad');if(!spend(900,'📣 Local campaign.'))return;s.marketing+=7;s.rep+=4;s.patients+=3;reward(25,'community reach');sync();toast('📣 More people heard about you!','good')}
function improve(){if(!spend(900,'🧭 Quality improvement cycle.'))return;s.quality+=5;s.rep+=2;reward(30,'quality improvement');result('You measured a problem, changed the process and reviewed the result.')}
function innovate(){if(!spend(1500,'💡 Innovation prototype.'))return;s.innovation+=9;s.access+=3;s.quality+=1;reward(45,'innovation');result('Prototype launched. Now observe whether it improves care.')}
function treat(){if(!s.patients)return toast('No patients are waiting — your capacity is ahead of demand!','good');let cap=Math.max(1,Math.min(capacity(),s.staff.length*4));if(s.treatments%cap===0&&s.well<35)return toast('Your team needs a breather before more care.','bad');s.patients--;s.cash+=95;s.quality+=.5;s.rep+=.3;s.treatments++;note('🩺 Patient completed a focused treatment session.');reward(10,'patient care');animatePatient();sync();toast('Patient treated · +€95','good')}
function endDay(){let cap=Math.max(1,Math.min(capacity(),s.staff.length*4));let n=Math.min(cap,s.patients);let revenue=n*(s.rooms.hybrid?112:92);let costs=180+s.staff.length*150;let net=revenue-costs;s.cash+=net;s.patients=Math.max(0,s.patients-n);s.quality+=n>=cap?-2:1;s.well+=n>=cap?-5:1;s.rep+=n?1:-.5;s.patients+=Math.max(1,Math.round((s.rep-40)/18)+Math.round(s.access/50));note(`☀️ Day ${s.day}: ${n} sessions · ${net>=0?'+':''}€${Math.round(net)} · capacity ${cap}`);reward(Math.max(10,n*5),'day completed');s.day++;if(s.day>5){s.day=1;s.week++;note(`📅 Week ${s.week-1} closed — review your people, quality and finances.`);if(s.week>12){s.week=1;s.year++;note('🏆 New practice year begins.')}}clamp();renderClinic();sync();toast(`${n} patients treated · ${net>=0?'+':''}€${Math.round(net)}`,net>=0?'good':'bad');if(fresh&&s.day===2&&s.week===1)nextIntro()}
const events=[['ACCESSIBILITY REQUEST','A patient finds the entrance difficult to navigate.',[['Build access','-€2,200 · +12 access · +1 quality',()=>build('access')],['Adapt workflow','+4 access · -1 wellbeing',()=>{s.access+=4;s.well-=1;result('The team adapted the patient flow.')}]]],['TEAM PRESSURE','Your team says the schedule feels too full.',[['Protect wellbeing','-€700 · +8 wellbeing · +1 quality',()=>{if(spend(700,'Protected staff wellbeing time.')){s.well+=8;s.quality+=1;result('You created breathing room.')}}],['Push through','-7 wellbeing · -3 quality',()=>{s.well-=7;s.quality-=3;result('Short-term output won, but the team paid for it.')}]]],['HYBRID CARE REQUEST','A community partner asks whether your practice can offer a hybrid pathway.',[['Prototype carefully','-€1,500 · +9 innovation · +3 access',()=>{if(spend(1500,'Prototyped a hybrid pathway.')){s.innovation+=9;s.access+=3;result('You tested hybrid care before scaling it.')}}],['Wait and learn','+2 quality',()=>{s.quality+=2;result('You chose to learn before investing.')}]]]];
function situation(){let e=events[Math.floor(Math.random()*events.length)];openChoice(e[0],e[1],e[2])}function openChoice(k,t,cs){$('mk').textContent=k;$('mt').textContent=t;$('md').textContent='There is no perfect answer. Look at the trade-off.';$('mb').innerHTML=cs.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('');window.cs=cs;showModal()}function choose(i){let x=window.cs[i];if(typeof x[2]==='function')x[2]();closeModal();clamp();sync();renderClinic()}function result(m){note(m);toast(m,'good');sync()}function showModal(){$('veil').classList.add('on');$('modal').classList.add('on')}function closeModal(){$('veil').classList.remove('on');$('modal').classList.remove('on')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function intro(){openChoice('DAY 1 · YOUR FIRST CLINIC','Welcome! You are the owner of a small Dutch physiotherapy practice. We will learn the game by doing.',[['① Treat','Start with one patient. This creates your first revenue and teaches the core loop.',()=>{closeModal();toast('Step 1: Treat a patient →','good')}],['② Reinvest','When you have earned enough, add capacity. Growth should follow demand.',()=>{closeModal();toast('Step 2: Reinvest wisely →','good')}],['③ Grow the system','Then unlock people, access, quality and innovation. Every choice creates trade-offs.',()=>{closeModal();toast('Step 3: Balance the practice →','good')}]]);$('mk').textContent='WELCOME · LEARN BY PLAYING'}
function nextIntro(){openChoice('DAY 2 · YOU ARE IN CHARGE','Yesterday you learned the basic loop. Today the clinic starts to become yours.',[['Follow the mission','Complete the next mission shown on the left.','close'],['Explore','Try the tabs, but keep your current mission in mind.','close'],['Think like a tycoon','Every purchase should improve the whole practice, not just one metric.','close']]);$('mk').textContent='ONBOARDING · CHAPTER 2'}
function renderClinic(){if(!window.g)return;g.meshes.slice().forEach(m=>{if(m.name!=='ground')m.dispose()});const scene=g;const mat=(n,c)=>{let m=new B.StandardMaterial(n,scene);m.diffuseColor=B.Color3.FromHexString(c);return m};let wall=mat('wall','#f8fbfa'),floor=mat('floor','#d9eee6'),green=mat('green','#35c99b'),pink=mat('pink','#ef7f9e'),blue=mat('blue','#6aaef2'),wood=mat('wood','#b98259'),dark=mat('dark','#35504a'),hy=mat('hybrid','#b9d8f5'),ramp=mat('ramp','#c8a96b'),white=mat('white','#ffffff');function box(n,x,z,w,d,h,m){let o=B.MeshBuilder.CreateBox(n,{width:w,depth:d,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}function cyl(n,x,z,r,h,m){let o=B.MeshBuilder.CreateCylinder(n,{diameter:r*2,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}
box('floor',0,0,16,12,.15,floor);box('back',0,-6,16,.25,3.4,wall);box('left',-8,0,.25,12,3.4,wall);
for(let i=0;i<s.rooms.treatment;i++){let x=-5.2+i*3.4;box('room'+i,x,-2,2.9,3.4,.18,green);box('bed'+i,x,-2,1.7,.7,.25,wood);cyl('patient'+i,x,-2.7,.24,.65,pink);cyl('staff'+i,x-.7,-1.45,.2,.8,blue)}
if(s.rooms.reception){box('desk',-4.3,3.4,4,1,.9,wood);cyl('plant',-5.4,4.1,.25,.8,green);cyl('receptionist',-3.5,3.8,.23,.75,pink)}
if(s.rooms.gym){box('gym',4,2.6,5,3,.18,blue);for(let i=0;i<3;i++){box('mat'+i,2.4+i*1.3,2.3,.9,1.5,.08,green);cyl('ball'+i,2.5+i*1.3,1.4,.22,.22,pink)}}
if(s.rooms.hybrid){box('hybrid',4,-.1,3.7,2.3,.18,hy);box('screen',4,-.1,1.6,.12,1.1,dark);cyl('hybridchair',4,-.85,.35,.45,white);cyl('digitalstaff',3.2,-.3,.2,.8,blue)}
if(s.rooms.access){box('ramp',-6.2,4.3,2.5,1.3,.15,ramp);box('rail',-5.1,4.3,.12,1.3,.75,dark)}
