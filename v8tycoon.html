<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fysioverse Tycoon — Dutch Physiotherapy Practice Simulator</title><meta name="description" content="A browser-based physiotherapy practice tycoon simulation for education."><script src="https://cdn.babylonjs.com/babylon.js"></script><style>:root{--ink:#17252c;--mut:#667780;--green:#24bd91;--pale:#e4f8f0;--line:#dce7e3;--gold:#e7b84b;--red:#b54a55;--blue:#4d91d9}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#cfe9df}button{font:inherit}.scene,.scene canvas{position:fixed;inset:0;width:100%;height:100%}.scene canvas{touch-action:none}.top{position:fixed;z-index:10;left:12px;right:12px;top:10px;display:flex;gap:7px;align-items:center;pointer-events:none}.logo,.stat,.season,.panel,.toolbar{background:#ffffffee;border:1px solid #fff;box-shadow:0 12px 35px #17312b1a;backdrop-filter:blur(10px);border-radius:15px}.logo{padding:10px 13px;font-weight:1000;letter-spacing:.08em}.logo b{color:#15916c}.stat{padding:6px 10px;min-width:70px}.stat small{display:block;color:var(--mut);font-size:8px;text-transform:uppercase}.stat strong{font-size:13px}.season{margin-left:auto;padding:9px 11px;font-weight:950;font-size:12px}.side{position:fixed;z-index:10;top:78px;bottom:74px;width:255px;overflow:auto}.left{left:12px}.right{right:12px}.panel{overflow:hidden;margin-bottom:9px}.head{padding:11px 13px;border-bottom:1px solid #e7ece9;font-weight:950}.body{padding:11px 13px}.small{font-size:11px;color:var(--mut);line-height:1.4}.nav{padding:6px}.nav button,.action{display:block;width:100%;border:0;border-radius:10px;background:#fff;padding:9px 10px;margin:3px 0;text-align:left;font-weight:850;cursor:pointer}.nav button:hover,.nav button.on,.action:hover{background:var(--pale);color:#087452}.action.primary{background:var(--green);color:#fff}.action.gold{background:#fff3d9}.action.blue{background:#edf6ff}.action.red{background:#fff0f1;color:#8e333c}.meter{height:7px;background:#e8eeea;border-radius:99px;overflow:hidden;margin:4px 0 8px}.meter i{display:block;height:100%;background:var(--green)}.meter.gold i{background:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{background:#f6faf8;border:1px solid #e2ebe7;border-radius:10px;padding:8px}.mini b{display:block;font-size:14px}.mini span{font-size:9px;color:var(--mut)}.toolbar{position:fixed;z-index:11;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;max-width:calc(100% - 550px);overflow:auto}.toolbar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-weight:850;cursor:pointer}.toolbar button:hover{border-color:var(--green)}.toast{position:fixed;z-index:50;left:50%;bottom:67px;transform:translateX(-50%);display:none;padding:10px 14px;border-radius:12px;background:#17252c;color:#fff;box-shadow:0 15px 35px #0004;font-weight:750}.toast.good{background:#087452}.toast.bad{background:#9b343e}.veil{position:fixed;z-index:40;inset:0;background:#13262b66;backdrop-filter:blur(3px);display:none}.veil.on{display:block}.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(650px,calc(100vw - 26px));max-height:calc(100vh - 26px);overflow:auto;background:#fffdf9;border-radius:22px;box-shadow:0 35px 90px #102b2440;display:none}.modal.on{display:block}.modaltop{padding:17px 20px;background:linear-gradient(135deg,#e1f8ee,#f9fff9);border-bottom:1px solid #e4ebe7}.modalbody{padding:16px 20px}.close{position:absolute;right:9px;top:9px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:22px;cursor:pointer}.choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px;margin:7px 0;text-align:left;cursor:pointer}.choice:hover{border-color:var(--green);background:#f3fcf8}.choice b{display:block}.choice span{display:block;font-size:10px;color:var(--mut);margin-top:2px}.log{max-height:155px;overflow:auto}.log div{padding:6px 0;border-bottom:1px solid #edf0ee;font-size:10px;color:#56656d}.objective{padding:9px;border-radius:11px;background:#f7faf8;border:1px solid #e2ebe7;margin:5px 0;font-size:10px}.objective.done{background:#e6f8ef;border-color:#bde7d6}.objective b{display:block;font-size:11px}.tag{display:inline-block;border-radius:99px;padding:3px 6px;font-size:9px;font-weight:850;background:var(--pale);color:#147456;margin:2px}.hint{padding:9px;background:#fff7e5;border-radius:10px;font-size:10px;line-height:1.4}.danger{color:#a23943}@media(max-width:1050px){.side{width:220px}.toolbar{max-width:calc(100% - 470px)}.stat:nth-of-type(n+4){display:none}}@media(max-width:720px){.side{display:none}.top{left:7px;right:7px}.logo{padding:9px}.stat{min-width:0}.stat:nth-of-type(n+3){display:none}.season{display:none}.toolbar{left:7px;right:7px;transform:none;max-width:none}.toast{bottom:72px}}
</style></head><body><div class="scene"><canvas id="c"></canvas></div><div class="top"><div class="logo">FYSIO<b>VERSE</b></div><div class="stat"><small>Cash</small><strong id="cash"></strong></div><div class="stat"><small>Patients</small><strong id="patients"></strong></div><div class="stat"><small>Quality</small><strong id="quality"></strong></div><div class="stat"><small>Reputation</small><strong id="repstat"></strong></div><div class="stat"><small>Team</small><strong id="team"></strong></div><div class="season" id="season"></div></div><aside class="side left"><div class="panel"><div class="head">Practice HQ</div><div class="nav"><button class="on" onclick="tab(this,'overview')">🏥 Overview</button><button onclick="tab(this,'patients')">👥 Patient demand</button><button onclick="tab(this,'team')">🧑‍⚕️ Team</button><button onclick="tab(this,'business')">💶 Business</button><button onclick="tab(this,'quality')">🧭 Quality</button><button onclick="tab(this,'research')">💡 Innovation</button></div></div><div class="panel"><div class="head">Practice health</div><div class="body"><div class="small">Team wellbeing</div><div class="meter"><i id="well"></i></div><div class="small">Access</div><div class="meter"><i id="access"></i></div><div class="small">Innovation</div><div class="meter"><i id="innovation"></i></div></div></div><div class="panel"><div class="head">Objectives</div><div class="body" id="objectives"></div></div></aside><aside class="side right"><div class="panel"><div class="head" id="rtitle">Clinic overview</div><div class="body" id="info"></div><div class="body"><button class="action primary" onclick="endDay()">End day →</button><button class="action gold" onclick="openEvent()">Open situation</button><button class="action blue" onclick="runSession()">Run treatment session</button></div></div><div class="panel"><div class="head">Activity log</div><div class="body log" id="log"></div></div></aside><div class="toolbar"><button onclick="build('treatment')">＋ Treatment room €6k</button><button onclick="build('gym')">＋ Exercise gym €8.5k</button><button onclick="build('reception')">＋ Reception €3.5k</button><button onclick="build('hybrid')">＋ Hybrid care €7k</button><button onclick="build('access')">＋ Access €2.2k</button><button onclick="hire()">＋ Hire €3.2k</button><button onclick="train()">🎓 Train €1.1k</button><button onclick="market()">📣 Campaign €900</button><button onclick="decorate()">✨ Decor €650</button></div><div class="toast" id="toast"></div><div class="veil" id="veil"></div><section class="modal" id="modal"><button class="close" onclick="closeModal()">×</button><div class="modaltop"><div class="small" id="mkicker"></div><h2 id="mtitle" style="margin:4px 0"></h2><div class="small" id="mdesc"></div></div><div class="modalbody" id="mbody"></div></section><script>const B=BABYLON,$=id=>document.getElementById(id);const KEY='fysioverse-v8';let s={cash:50000,patients:12,quality:78,access:68,well:84,rep:50,innovation:10,day:1,week:1,year:1,rooms:{treatment:2,gym:false,reception:false,hybrid:false,access:false},staff:[{name:'Sanne',role:'Physio',mood:84},{name:'Daan',role:'Physio',mood:81}],marketing:0,contract:0,log:['Day 1: Welcome to your new practice.'],wins:[]};try{Object.assign(s,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(s));function clamp(){['quality','access','well','rep','innovation'].forEach(k=>s[k]=Math.max(0,Math.min(100,s[k])));s.cash=Math.max(-15000,s.cash);s.patients=Math.max(5,Math.min(80,Math.round(s.patients)))}function note(x){s.log.push(x);if(s.log.length>45)s.log.shift()}function toast(x,c=''){const e=$('toast');e.textContent=x;e.className='toast '+c;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2300)}function sync(){clamp();$('cash').textContent='€'+Math.round(s.cash).toLocaleString('nl-NL');$('patients').textContent=s.patients;$('quality').textContent=Math.round(s.quality)+'%';$('repstat').textContent=Math.round(s.rep)+'%';$('team').textContent=Math.round(s.well)+'%';$('season').textContent=`YEAR ${s.year} · WEEK ${s.week} · DAY ${s.day}`;$('well').style.width=s.well+'%';$('access').style.width=s.access+'%';$('innovation').style.width=s.innovation+'%';$('log').innerHTML=s.log.slice(-10).reverse().map(x=>'<div>'+x+'</div>').join('');objectives();save()}function objectives(){const a=[['Build a real clinic',s.rooms.treatment>=3,'3 treatment rooms'],['Become accessible',s.access>=80,'80% access'],['Build a team',s.staff.length>=3,'3 team members'],['Grow reputation',s.rep>=65,'65 reputation'],['Go hybrid',!!s.rooms.hybrid,'Hybrid care room'],['Reach quality 85',s.quality>=85,'85% quality'],['Innovate',s.innovation>=35,'35% innovation']];$('objectives').innerHTML=a.map(x=>`<div class="objective ${x[1]?'done':''}"><b>${x[1]?'✓':'○'} ${x[0]}</b><span>${x[2]}</span></div>`).join('')}function tab(b,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const title={overview:'Clinic overview',patients:'Patient demand',team:'Your team',business:'Business control',quality:'Quality improvement',research:'Innovation lab'}[n];$('rtitle').textContent=title;let html='';if(n==='overview')html=`<b>Your clinic is alive.</b><p class="small">Capacity, demand, quality, people and money now interact every day. Build the practice you want to run.</p><span class="tag">Tycoon</span><span class="tag">Dutch practice</span><span class="tag">Experiential learning</span>`;if(n==='patients')html=`<b>${s.patients} active fictional patients</b><p class="small">Demand rises with reputation, access and marketing. Capacity is limited by rooms and staff.</p><div class="grid"><div class="mini"><b>${capacity()}</b><span>daily capacity</span></div><div class="mini"><b>${s.marketing}</b><span>campaign points</span></div></div>`;if(n==='team')html=s.staff.map(x=>`<div class="mini" style="margin:5px 0"><b>${x.name}</b><span>${x.role} · wellbeing ${x.mood}%</span></div>`).join('')+`<button class="action primary" onclick="hire()">Hire junior · €3,200</button><button class="action" onclick="train()">Team development · €1,100</button>`;if(n==='business')html=`<b>Practice economy</b><p class="small">Revenue comes from delivered sessions and selected contract work. Investment changes future capacity and quality.</p><div class="grid"><div class="mini"><b>€${Math.round(s.cash).toLocaleString('nl-NL')}</b><span>cash</span></div><div class="mini"><b>${s.contract? 'Active':'Open'}</b><span>contract</span></div></div><button class="action gold" onclick="contract()">${s.contract?'Review contract':'Negotiate contract'}</button>`;if(n==='quality')html=`<b>Quality improvement cycle</b><p class="small">Use a continuous cycle: identify → intervene → measure → reflect → adapt.</p><button class="action primary" onclick="improve()">Run improvement cycle · €900</button>`;if(n==='research')html=`<b>Innovation lab</b><p class="small">Invest in digital/hybrid workflows, staff learning and service design. Innovation is useful only when it improves care or sustainability.</p><button class="action blue" onclick="innovate()">Prototype service · €1,500</button>`;$('info').innerHTML=html}function capacity(){return s.rooms.treatment*4+(s.rooms.gym?4:0)+(s.rooms.hybrid?3:0)}function spend(cost,reason){if(s.cash<cost){toast('Not enough cash.','bad');return false}s.cash-=cost;note(reason);return true}function build(t){const cost={treatment:6000,gym:8500,reception:3500,hybrid:7000,access:2200}[t];if(t==='treatment'){if(!spend(cost,'Built a treatment room.'))return;if(s.rooms.treatment>=5){toast('Maximum treatment rooms reached.','bad');return}s.rooms.treatment++;s.quality+=2;s.patients+=2}else{if(s.rooms[t])return toast('Already built.');if(!spend(cost,'Built '+t+' facilities.'))return;s.rooms[t]=true;if(t==='gym'){s.quality+=4;s.innovation+=4}if(t==='reception')s.access+=2;if(t==='hybrid'){s.innovation+=12;s.quality+=2}s.access+=t==='access'?12:0}renderClinic();sync();toast('Upgrade built — the clinic changed.','good')}function hire(){if(s.staff.length>=6)return toast('Team is full for this clinic.');if(!spend(3200,'Hired a junior physiotherapist.'))return;const names=['Noor','Youssef','Eva','Lotte','Ravi','Mila'];s.staff.push({name:names[(s.staff.length-2)%names.length],role:'Junior physio',mood:76});s.well-=2;renderClinic();sync();toast('New team member hired.','good')}function train(){if(!spend(1100,'Protected team development time.'))return;s.staff.forEach(x=>x.mood=Math.min(100,x.mood+4));s.well+=5;s.quality+=2;s.innovation+=3;sync();toast('Team development completed.','good')}function market(){if(!spend(900,'Ran a local community campaign.'))return;s.marketing+=8;s.rep+=5;s.patients+=3;sync();toast('Demand is rising.','good')}function decorate(){if(!spend(650,'Improved the clinic environment.'))return;s.rep+=3;s.well+=2;renderClinic();sync();toast('The clinic feels more welcoming.','good')}function contract(){if(s.contract){openChoice('CONTRACT REVIEW','Your payer contract is active. Protect access without letting volume overwhelm quality.',[['Keep current terms','Stable · +€350/day when capacity is used',()=>{s.contract=1;result('Contract maintained.')}],['Renegotiate for quality','-€1,000 · +5 quality · better rate',()=>{if(!spend(1000,'Renegotiated contract around quality.'))return;s.contract=2;s.quality+=5;result('The contract now rewards quality more strongly.')}]]);return}openChoice('BUSINESS DECISION','A local network offers a contract. More volume means more revenue — but also pressure on capacity.',[['Accept immediately','+€350/day · +10 patients · workload risk',()=>{s.contract=1;s.patients+=10;note('Accepted a volume contract.');result('The contract brings demand. Watch capacity.')}],['Negotiate safeguards','-€800 · +4 quality · +5 access',()=>{if(!spend(800,'Negotiated access and quality safeguards.'))return;s.contract=2;s.quality+=4;s.access+=5;result('You negotiated safeguards before signing.')}],['Decline','€0 · preserve capacity',()=>{note('Declined the contract to protect capacity.');result('Capacity remains under your control.')}]] )}function improve(){if(!spend(900,'Ran a quality improvement cycle.'))return;s.quality+=5;s.rep+=2;s.innovation+=2;result('Quality cycle completed: the practice learned and adapted.')}function innovate(){if(!spend(1500,'Prototyped a new service workflow.'))return;s.innovation+=9;s.quality+=2;s.access+=3;result('Prototype launched. Measure whether it actually helps.')}function runSession(){const n=Math.min(1,s.patients);if(!spend(0,'You personally ran a treatment session.'))return;s.cash+=95;s.quality+=2;s.rep+=1;s.patients=Math.max(5,s.patients-n);note('Owner treated a patient and reviewed the goal.');sync();toast('Session completed · +€95','good')}function endDay(){const cap=capacity();const staffCap=s.staff.length*4;const usable=Math.min(cap,staffCap,s.patients);const overload=Math.max(0,usable-Math.max(1,Math.floor(cap*.8)));let rev=usable*(s.rooms.hybrid?112:92);if(s.contract)rev+=Math.min(usable,8)*(s.contract===2?42:35);const fixed=220+s.staff.length*150;const result=rev-fixed;s.cash+=result;s.quality+=usable>cap*.92?-3:usable>0?1:0;s.well+=overload?-4:usable>staffCap*.85?-2:1;s.rep+=usable>0?Math.min(1,usable/20):-.5;const demand=Math.round((s.rep-45)/12)+Math.round(s.access/35)+Math.round(s.marketing/12);s.patients=Math.max(5,s.patients+Math.max(-2,1+demand-Math.round(usable/5)));s.marketing=Math.max(0,s.marketing-2);note(`Day ${s.day}: ${usable} sessions · ${result>=0?'+':''}€${Math.round(result)} · capacity ${cap}`);s.day++;if(s.day>5){s.day=1;s.week++;note(`Week closed: quality ${Math.round(s.quality)}% · reputation ${Math.round(s.rep)}%`);if(s.week>12){s.week=1;s.year++;note('Year completed. Your practice enters a new year.');}}clamp();randomEvent();renderClinic();sync();toast(`${usable} patients treated · ${result>=0?'+':''}€${Math.round(result)}`,result>=0?'good':'bad')}const events=[['ACCESSIBILITY REQUEST','A patient says the entrance and waiting flow are difficult to navigate.',[['Invest in access','-€2,200 · +12 access · +2 quality',()=>{if(!spend(2200,'Invested in accessibility.'))return;s.access+=12;s.quality+=2;result('Access improved for future patients.')}],['Adapt the workflow','Low cost · +4 access · -1 wellbeing',()=>{s.access+=4;s.well-=1;note('Adapted workflow around an access barrier.');result('A practical workaround helped the patient.')}],['Ignore it','€0 · -5 access · -4 reputation',()=>{s.access-=5;s.rep-=4;result('The barrier remained and reputation suffered.')}]]],['BURNOUT WARNING','Sanne says the current workload is becoming unsustainable.',[['Protect development time','-€700 · +8 wellbeing · +1 quality',()=>{if(!spend(700,'Protected staff wellbeing time.'))return;s.well+=8;s.quality+=1;result('The team has more breathing room.')}],['Add capacity','-€3,200 · hire',()=>{hire();result('You added capacity, but remember that hiring also needs onboarding.')}],['Push through','€0 · -7 wellbeing · -3 quality',()=>{s.well-=7;s.quality-=3;result('Short-term output improved, but the team paid the price.')}]]],['DIGITAL CARE REQUEST','A community partner asks whether you can offer a hybrid pathway.',[['Prototype hybrid','-€1,500 · +9 innovation · +3 access',()=>{if(!spend(1500,'Prototyped hybrid care.'))return;s.innovation+=9;s.access+=3;result('A small hybrid pathway is now available.')}],['Wait for evidence','€0 · +2 quality',()=>{s.quality+=2;result('You chose to learn before scaling.')}],['Launch immediately','-€500 · +8 innovation · -2 wellbeing',()=>{if(!spend(500,'Launched digital care quickly.'))return;s.innovation+=8;s.well-=2;result('The idea is live, but implementation pressure increased.')}]]],['COMPLAINT','A patient says the clinic felt rushed during a busy day.',[['Review the process','-€400 · +4 quality · +2 reputation',()=>{if(!spend(400,'Reviewed the patient journey after a complaint.'))return;s.quality+=4;s.rep+=2;result('You used the complaint as a quality signal.')}],['Offer a quick apology','-€100 · +2 reputation',()=>{if(!spend(100,'Followed up with the patient.'))return;s.rep+=2;result('The patient felt heard, but the process remains unchanged.')}],['Dismiss it','€0 · -5 reputation',()=>{s.rep-=5;result('The complaint was dismissed. Reputation fell.')}]]]];function randomEvent(){if(Math.random()<.42)openEvent()}function openEvent(){const e=events[Math.floor(Math.random()*events.length)];openChoice(e[0],e[1],e[2])}function openChoice(k,t,choices){$('mkicker').textContent=k;$('mtitle').textContent=t;$('mdesc').textContent='Choose deliberately. There is rarely a perfect answer — only trade-offs.';$('mbody').innerHTML=choices.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('');window.currentChoices=choices;showModal()}function choose(i){const fn=window.currentChoices[i][2];fn();closeModal();clamp();sync();renderClinic()}function result(msg){note(msg);toast(msg,'good');sync()}function showModal(){$('veil').classList.add('on');$('modal').classList.add('on')}function closeModal(){$('veil').classList.remove('on');$('modal').classList.remove('on')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function renderClinic(){while(window.g&&g.meshes.length>0){const m=g.meshes[g.meshes.length-1];if(m.name!=='ground')m.dispose();else break}const scene=g;if(!scene)return;const mat=(name,color)=>{const m=new B.StandardMaterial(name,scene);m.diffuseColor=B.Color3.FromHexString(color);return m};const wall=mat('wall','#f8fbfa'),floor=mat('floor','#d9eee6'),green=mat('green','#35c99b'),pink=mat('pink','#ef7f9e'),blue=mat('blue','#6aaef2'),wood=mat('wood','#b98259'),dark=mat('dark','#35504a');function box(name,x,z,w,d,h,color){const m=B.MeshBuilder.CreateBox(name,{width:w,depth:d,height:h},scene);m.position.set(x,h/2,z);m.material=color;return m}function cyl(name,x,z,r,h,color){const m=B.MeshBuilder.CreateCylinder(name,{diameter:r*2,height:h},scene);m.position.set(x,h/2,z);m.material=color;return m}const W=15,D=11;box('floor',0,0,W,D,.15,floor);box('back',0,-D/2,W,.25,3.2,wall);box('left',-W/2,0,.25,D,3.2,wall);for(let i=0;i<s.rooms.treatment;i++){const x=-5+i*3.2;box('room',x,-1.8,2.7,3.3,.18,green);box('bed',x,-1.7,1.7,.7,.25,wood);cyl('patient',x,-2.5,.24,.65,pink);cyl('staff',x-.7,-1.4,.2,.8,blue)}if(s.rooms.gym){box('gym',4,2.5,5,3,.18,blue);for(let i=0;i<3;i++)cyl('gymmat',2.7+i*1.2,2.3,.35,.12,green)}if(s.rooms.reception){box('desk',-4,3.2,4,1,.9,wood);cyl('plant',-5,3.8,.25,.8,green)}if(s.rooms.hybrid){box('hybrid',4,0,3.5,2.2,.18,'#b9d8f5');box('screen',4,0,1.6,.12,1.1,dark)}if(s.rooms.access){box('ramp',-6.3,3.8,2.2,1.3,.15,'#c8a96b')}for(let i=0;i<Math.min(s.staff.length,6);i++){const x=-5+i*2; cyl('person',x,4.3,.28,.9,i%2?blue:pink)}}function setup(){const canvas=$('c');const engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});g=new B.Scene(engine);g.clearColor=B.Color4.FromHexString('#cfe9dfff');const cam=new B.ArcRotateCamera('cam',-Math.PI/2.4,1.02,24,new B.Vector3(0,0,0),g);cam.lowerRadiusLimit=14;cam.upperRadiusLimit=34;cam.attachControl(canvas,true);cam.wheelPrecision=70;const light=new B.HemisphericLight('light',new B.Vector3(0,1,0),g);light.intensity=.95;const ground=B.MeshBuilder.CreateGround('ground',{width:60,height:60},g);const gm=new B.StandardMaterial('groundmat',g);gm.diffuseColor=B.Color3.FromHexString('#9bd1bd');ground.material=gm;window.g=g;renderClinic();engine.runRenderLoop(()=>g.render());window.addEventListener('resize',()=>engine.resize())}setup();tab(document.querySelector('.nav button'),'overview');sync();</script></body></html>
