<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fysioverse Tycoon</title><script src="https://cdn.babylonjs.com/babylon.js"></script><style>:root{--ink:#17252c;--mut:#65757d;--g:#25bd91;--p:#e6f8f1;--line:#dce8e3;--gold:#efbd4e;--blue:#69aef1}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#cfe9df}button{font:inherit;cursor:pointer}.scene,.scene canvas{position:fixed;inset:0;width:100%;height:100%}.top{position:fixed;z-index:10;top:10px;left:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}.logo,.stat,.day,.panel,.bar{background:#fffffff2;border:1px solid #fff;border-radius:15px;box-shadow:0 12px 35px #17312b1c;backdrop-filter:blur(9px)}.logo{padding:10px 13px;font-weight:1000;letter-spacing:.08em}.logo b{color:#14916c}.stat{padding:6px 10px;min-width:72px}.stat small{display:block;color:var(--mut);font-size:8px;text-transform:uppercase}.stat strong{font-size:13px}.day{margin-left:auto;padding:9px 11px;font-weight:950;font-size:12px}.side{position:fixed;z-index:10;top:78px;bottom:72px;width:255px;overflow:auto}.left{left:12px}.right{right:12px}.panel{overflow:hidden;margin-bottom:9px}.head{padding:11px 13px;border-bottom:1px solid #e7ece9;font-weight:950}.body{padding:11px 13px}.small{font-size:11px;color:var(--mut);line-height:1.45}.nav{padding:6px}.nav button,.action{display:block;width:100%;border:0;border-radius:10px;background:#fff;padding:9px 10px;margin:3px 0;text-align:left;font-weight:850}.nav button.on,.nav button:hover,.action:hover{background:var(--p);color:#087452}.primary{background:var(--g)!important;color:white!important}.gold{background:#fff3d9!important}.blue{background:#edf6ff!important}.meter{height:7px;background:#e8eeea;border-radius:99px;overflow:hidden;margin:4px 0 8px}.meter i{display:block;height:100%;background:var(--g)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mini{background:#f6faf8;border:1px solid #e2ebe7;border-radius:10px;padding:8px}.mini b{display:block;font-size:14px}.mini span{font-size:9px;color:var(--mut)}.quest{padding:9px;border-radius:11px;background:#f7faf8;border:1px solid #e2ebe7;margin:5px 0;font-size:10px}.quest.done{background:#e5f8ef;border-color:#bde7d6}.quest b{display:block;font-size:11px}.bar{position:fixed;z-index:11;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;max-width:calc(100% - 550px);overflow:auto}.bar button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 9px;font-weight:850}.toast{position:fixed;z-index:60;left:50%;bottom:67px;transform:translateX(-50%);display:none;padding:10px 14px;border-radius:12px;background:#17252c;color:white;font-weight:800;box-shadow:0 15px 35px #0004}.toast.good{background:#087452}.toast.bad{background:#9b343e}.veil{position:fixed;z-index:40;inset:0;background:#13262b77;backdrop-filter:blur(4px);display:none}.veil.on{display:block}.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,calc(100vw - 26px));max-height:calc(100vh - 26px);overflow:auto;background:#fffdf9;border-radius:22px;box-shadow:0 35px 90px #102b2440;display:none}.modal.on{display:block}.mtop{padding:19px 22px;background:linear-gradient(135deg,#e1f8ee,#fbfff9);border-bottom:1px solid #e4ebe7}.mbody{padding:17px 22px}.close{position:absolute;right:9px;top:9px;width:38px;height:38px;border:0;border-radius:50%;background:#fff;font-size:22px}.choice{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px;margin:7px 0;text-align:left}.choice:hover{border-color:var(--g);background:#f3fcf8}.choice b{display:block}.choice span{display:block;font-size:10px;color:var(--mut);margin-top:3px}.tip{padding:11px;background:#fff7e5;border-radius:11px;font-size:11px;line-height:1.45}.log{max-height:145px;overflow:auto}.log div{padding:6px 0;border-bottom:1px solid #edf0ee;font-size:10px;color:#56656d}@media(max-width:1050px){.side{width:220px}.bar{max-width:calc(100% - 470px)}}@media(max-width:720px){.side{display:none}.top{left:7px;right:7px}.stat:nth-of-type(n+3){display:none}.day{display:none}.bar{left:7px;right:7px;transform:none;max-width:none}.toast{bottom:72px}}</style></head><body><div class="scene"><canvas id="c"></canvas></div><div class="top"><div class="logo">FYSIO<b>VERSE</b></div><div class="stat"><small>Cash</small><strong id="cash"></strong></div><div class="stat"><small>Patients</small><strong id="patients"></strong></div><div class="stat"><small>Quality</small><strong id="quality"></strong></div><div class="stat"><small>Reputation</small><strong id="rep"></strong></div><div class="stat"><small>Team</small><strong id="team"></strong></div><div class="day" id="day"></div></div><aside class="side left"><div class="panel"><div class="head">Practice HQ</div><div class="nav"><button class="on" onclick="tab(this,'overview')">🏥 Overview</button><button onclick="tab(this,'patients')">👥 Patients</button><button onclick="tab(this,'team')">🧑‍⚕️ Team</button><button onclick="tab(this,'business')">💶 Business</button><button onclick="tab(this,'quality')">🧭 Quality</button><button onclick="tab(this,'innovation')">💡 Innovation</button></div></div><div class="panel"><div class="head">Practice health</div><div class="body"><div class="small">Team wellbeing</div><div class="meter"><i id="well"></i></div><div class="small">Access</div><div class="meter"><i id="access"></i></div><div class="small">Innovation</div><div class="meter"><i id="innov"></i></div></div></div><div class="panel"><div class="head">Today's quest</div><div class="body" id="quests"></div></div></aside><aside class="side right"><div class="panel"><div class="head" id="rtitle">Clinic overview</div><div class="body" id="info"></div><div class="body"><button class="action primary" onclick="endDay()">End day → collect revenue</button><button class="action gold" onclick="situation()">Open situation</button><button class="action blue" onclick="session()">Treat one patient</button></div></div><div class="panel"><div class="head">Activity</div><div class="body log" id="log"></div></div></aside><div class="bar"><button onclick="build('treatment')">＋ Treatment room · €6k</button><button onclick="build('reception')">＋ Reception · €3.5k</button><button onclick="build('gym')">＋ Exercise gym · €8.5k</button><button onclick="build('hybrid')">＋ Hybrid care · €7k</button><button onclick="build('access')">＋ Access · €2.2k</button><button onclick="hire()">＋ Hire · €3.2k</button><button onclick="train()">🎓 Train · €1.1k</button><button onclick="market()">📣 Campaign · €900</button></div><div class="toast" id="toast"></div><div class="veil" id="veil"></div><section class="modal" id="modal"><button class="close" onclick="closeModal()">×</button><div class="mtop"><div class="small" id="mk"></div><h2 id="mt" style="margin:4px 0"></h2><div class="small" id="md"></div></div><div class="mbody" id="mb"></div></section><script>const B=BABYLON,$=x=>document.getElementById(x),KEY='fysioverse-v9';let fresh=!localStorage.getItem(KEY);let s={cash:50000,patients:8,quality:78,access:65,well:86,rep:45,innovation:8,day:1,week:1,year:1,rooms:{treatment:1,reception:false,gym:false,hybrid:false,access:false},staff:[{name:'Sanne',role:'Physio',mood:86}],marketing:0,contract:false,quests:[],log:['Morning 1: Your keys are on the desk.'],milestones:[]};try{if(!fresh)Object.assign(s,JSON.parse(localStorage.getItem(KEY))||{})}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(s));function clamp(){['quality','access','well','rep','innovation'].forEach(k=>s[k]=Math.max(0,Math.min(100,s[k])));s.cash=Math.max(0,s.cash);s.patients=Math.max(0,Math.min(80,Math.round(s.patients)))}function note(x){s.log.push(x);if(s.log.length>50)s.log.shift()}function toast(x,c=''){let e=$('toast');e.textContent=x;e.className='toast '+c;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2400)}function sync(){clamp();$('cash').textContent='€'+Math.round(s.cash).toLocaleString('nl-NL');$('patients').textContent=s.patients;$('quality').textContent=Math.round(s.quality)+'%';$('rep').textContent=Math.round(s.rep)+'%';$('team').textContent=Math.round(s.well)+'%';$('day').textContent=`YEAR ${s.year} · WEEK ${s.week} · DAY ${s.day}`;$('well').style.width=s.well+'%';$('access').style.width=s.access+'%';$('innov').style.width=s.innovation+'%';$('log').innerHTML=s.log.slice(-10).reverse().map(x=>'<div>'+x+'</div>').join('');quests();save()}function quests(){let q=[['Build your first treatment room',s.rooms.treatment>=2,'Add 1 room'],['Welcome patients',s.patients<=6,'Treat patients to reduce the queue'],['Make the clinic accessible',s.access>=75,'Reach 75% access'],['Grow your team',s.staff.length>=2,'Hire 1 colleague'],['Improve quality',s.quality>=82,'Reach 82% quality'],['Unlock hybrid care',s.rooms.hybrid,'Build Hybrid Care']];$('quests').innerHTML=q.map((x,i)=>`<div class="quest ${x[1]?'done':''}"><b>${x[1]?'✓':'○'} ${x[0]}</b><span>${x[2]}</span></div>`).join('')}function tab(b,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let titles={overview:'Clinic overview',patients:'Patient demand',team:'Your team',business:'Business control',quality:'Quality improvement',innovation:'Innovation lab'};$('rtitle').textContent=titles[n];let h='';if(n==='overview')h=`<b>Build a practice, one decision at a time.</b><p class="small">This is your home base. Start small, treat patients, earn money, then reinvest. New options unlock as the practice grows.</p><div class="tip">💡 <b>Tycoon rule:</b> don't buy everything at once. Your clinic, people and patient flow need to stay balanced.</div>`;if(n==='patients')h=`<b>${s.patients} patients waiting</b><p class="small">Demand grows through reputation, access and marketing. Capacity depends on rooms, staff and hybrid care.</p><div class="grid"><div class="mini"><b>${capacity()}</b><span>room capacity</span></div><div class="mini"><b>${s.staff.length*4}</b><span>team capacity</span></div></div>`;if(n==='team')h=s.staff.map(x=>`<div class="mini" style="margin:5px 0"><b>${x.name}</b><span>${x.role} · mood ${x.mood}%</span></div>`).join('')+`<button class="action primary" onclick="hire()">Hire junior · €3,200</button><button class="action" onclick="train()">Team training · €1,100</button>`;if(n==='business')h=`<b>Practice economy</b><p class="small">Treatments create revenue. Investments change future capacity, access, quality or innovation.</p><div class="grid"><div class="mini"><b>€${Math.round(s.cash).toLocaleString('nl-NL')}</b><span>cash</span></div><div class="mini"><b>${s.contract?'Active':'None'}</b><span>contract</span></div></div>`;if(n==='quality')h=`<b>Quality cycle</b><p class="small">Identify → intervene → measure → reflect → adapt.</p><button class="action primary" onclick="improve()">Run improvement cycle · €900</button>`;if(n==='innovation')h=`<b>Innovation lab</b><p class="small">Hybrid and digital care can increase access, but only when the workflow remains safe and sustainable.</p><button class="action blue" onclick="innovate()">Prototype service · €1,500</button>`;$('info').innerHTML=h}function capacity(){return s.rooms.treatment*4+(s.rooms.gym?4:0)+(s.rooms.hybrid?3:0)}function spend(c,msg){if(s.cash<c){toast('Not enough cash yet. Treat patients or wait for tomorrow.','bad');return false}s.cash-=c;note(msg);return true}function build(t){let costs={treatment:6000,reception:3500,gym:8500,hybrid:7000,access:2200};if(t==='treatment'&&s.rooms.treatment>=4)return toast('Your clinic has reached its room limit.');if(t!=='treatment'&&s.rooms[t])return toast('You already built this.');if(!spend(costs[t],'Built '+t+' facilities.'))return;if(t==='treatment'){s.rooms.treatment++;s.quality+=2;s.patients+=1}if(t==='reception'){s.rooms.reception=true;s.access+=3}if(t==='gym'){s.rooms.gym=true;s.quality+=4;s.innovation+=3}if(t==='hybrid'){s.rooms.hybrid=true;s.innovation+=10;s.access+=5;s.quality+=2;note('Hybrid Care unlocked: digital appointments can now be part of your patient journey.')}if(t==='access'){s.rooms.access=true;s.access+=12;s.quality+=1}renderClinic();sync();toast('New clinic space added!','good')}function hire(){if(s.staff.length>=5)return toast('Your practice is fully staffed for now.');if(!spend(3200,'Hired a junior physiotherapist.'))return;let names=['Noor','Daan','Lotte','Ravi'];s.staff.push({name:names[s.staff.length-1],role:'Junior physio',mood:76});s.well-=3;renderClinic();sync();toast('New colleague joined the team.','good')}function train(){if(!spend(1100,'Team development session completed.'))return;s.staff.forEach(x=>x.mood=Math.min(100,x.mood+5));s.well+=5;s.quality+=2;s.innovation+=2;sync();toast('Team learned together.','good')}function market(){if(!spend(900,'Ran a local community campaign.'))return;s.marketing+=7;s.rep+=4;s.patients+=3;sync();toast('More people heard about your clinic.','good')}function improve(){if(!spend(900,'Ran a quality improvement cycle.'))return;s.quality+=5;s.rep+=2;result('You measured a problem, changed the process and reviewed the result.')}function innovate(){if(!spend(1500,'Prototyped a new care workflow.'))return;s.innovation+=9;s.access+=3;s.quality+=1;result('Prototype launched. Now observe whether it improves care.')}function session(){if(!s.patients)return toast('No patients are waiting. Great capacity!');s.patients--;s.cash+=95;s.quality+=1;s.rep+=.5;note('A patient received a focused treatment session.');sync();toast('Patient treated · +€95','good')}function endDay(){let cap=Math.min(capacity(),s.staff.length*4);let n=Math.min(cap,s.patients);let revenue=n*(s.rooms.hybrid?112:92)+(s.contract?180:0);let costs=180+s.staff.length*150;let net=revenue-costs;s.cash+=net;s.patients=Math.max(0,s.patients-n);s.quality+=n>cap*.9?-2:1;s.well+=n>cap*.9?-5:1;s.rep+=n?1:-.5;s.patients+=Math.max(1,Math.round((s.rep-40)/18)+Math.round(s.access/50));s.marketing=Math.max(0,s.marketing-2);note(`Day ${s.day}: ${n} sessions · ${net>=0?'+':''}€${Math.round(net)} · capacity ${cap}`);s.day++;if(s.day>5){s.day=1;s.week++;note(`Week ${s.week-1} closed. Review your quality, people and finances.`);if(s.week>12){s.week=1;s.year++;note('A new practice year begins.')}}clamp();renderClinic();sync();toast(`${n} patients treated · ${net>=0?'+':''}€${Math.round(net)}`,net>=0?'good':'bad');if(n>=1&&s.day===2&&s.week===1)introStep()}function introStep(){if(s.day!==2||s.week!==1)return;openChoice('YOUR FIRST MORNING','You survived day one. What should you focus on next?',[['Expand capacity','Build a second treatment room when you can afford it.','close'],['Protect quality','Use the quality tab and train your team before scaling.','close'],['Experiment','Explore the Innovation tab, but keep an eye on workload.','close']])}const events=[['ACCESSIBILITY REQUEST','A patient finds the entrance difficult to navigate.',[['Build access','-€2,200 · +12 access · +1 quality',()=>{if(spend(2200,'Improved physical access.')){s.access+=12;s.quality+=1;result('The environment became easier to use.')}}],['Adapt workflow','+4 access · -1 wellbeing',()=>{s.access+=4;s.well-=1;result('The team adapted the patient flow.')}]]],['TEAM PRESSURE','Your team says the schedule feels too full.',[['Protect wellbeing','-€700 · +8 wellbeing · +1 quality',()=>{if(spend(700,'Protected staff wellbeing time.')){s.well+=8;s.quality+=1;result('You created breathing room.')}}],['Push through','-7 wellbeing · -3 quality',()=>{s.well-=7;s.quality-=3;result('Short-term output won, but the team paid for it.')}]]],['HYBRID CARE REQUEST','A community partner asks whether your practice can offer a hybrid pathway.',[['Prototype carefully','-€1,500 · +9 innovation · +3 access',()=>{if(spend(1500,'Prototyped a hybrid pathway.')){s.innovation+=9;s.access+=3;result('You tested hybrid care before scaling it.')}}],['Wait and learn','+2 quality',()=>{s.quality+=2;result('You chose to learn before investing.')}]]]];function situation(){let e=events[Math.floor(Math.random()*events.length)];openChoice(e[0],e[1],e[2])}function openChoice(k,t,cs){$('mk').textContent=k;$('mt').textContent=t;$('md').textContent='There is no perfect answer. Look at the trade-off and choose.';$('mb').innerHTML=cs.map((c,i)=>`<button class="choice" onclick="choose(${i})"><b>${c[0]}</b><span>${c[1]}</span></button>`).join('');window.cs=cs;showModal()}function choose(i){let x=window.cs[i];if(typeof x[2]==='function')x[2]();closeModal();clamp();sync();renderClinic()}function result(m){note(m);toast(m,'good');sync()}function showModal(){$('veil').classList.add('on');$('modal').classList.add('on')}function closeModal(){$('veil').classList.remove('on');$('modal').classList.remove('on')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function onboarding(){openChoice('WELCOME TO FYSIOVERSE','You are opening a small Dutch physiotherapy practice. Your goal is not to become huge overnight — it is to build a practice that works.',[['1 · Start with patients','Your first priority is simple: treat patients. Use “Treat one patient” to earn your first cash.',()=>{note('Onboarding: first priority is patient care.');closeModal();toast('Step 1: Treat a patient →','good')}],['2 · Reinvest','Use your earnings to add a treatment room. More rooms mean more capacity.',()=>{note('Onboarding: reinvest revenue into capacity.');closeModal();toast('Step 2: Grow when you can afford it.','good')}],['3 · Balance the practice','Later you will hire, improve quality, increase access and unlock hybrid care. Each choice has trade-offs.',()=>{note('Onboarding: balance care, people, quality and business.');closeModal();toast('You are ready. Build your practice!','good')}]]);$('mk').textContent='DAY 1 · YOUR FIRST PRACTICE';$('md').textContent='Learn by doing. You can always open situations later.'}function renderClinic(){if(!window.g)return;window.g.meshes.slice().forEach(m=>{if(m.name!=='ground')m.dispose()});const scene=g;const mat=(n,c)=>{let m=new B.StandardMaterial(n,scene);m.diffuseColor=B.Color3.FromHexString(c);return m};let wall=mat('wall','#f8fbfa'),floor=mat('floor','#d9eee6'),green=mat('green','#35c99b'),pink=mat('pink','#ef7f9e'),blue=mat('blue','#6aaef2'),wood=mat('wood','#b98259'),dark=mat('dark','#35504a'),hy=mat('hybrid','#b9d8f5'),ramp=mat('ramp','#c8a96b');function box(n,x,z,w,d,h,m){let o=B.MeshBuilder.CreateBox(n,{width:w,depth:d,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}function cyl(n,x,z,r,h,m){let o=B.MeshBuilder.CreateCylinder(n,{diameter:r*2,height:h},scene);o.position.set(x,h/2,z);o.material=m;return o}box('floor',0,0,15,11,.15,floor);box('back',0,-5.5,15,.25,3.2,wall);box('left',-7.5,0,.25,11,3.2,wall);for(let i=0;i<s.rooms.treatment;i++){let x=-5+i*3.2;box('room',x,-1.8,2.7,3.3,.18,green);box('bed',x,-1.7,1.7,.7,.25,wood);cyl('patient',x,-2.5,.24,.65,pink);cyl('staff',x-.7,-1.4,.2,.8,blue)}if(s.rooms.reception){box('desk',-4,3.2,4,1,.9,wood);cyl('plant',-5,3.8,.25,.8,green)}if(s.rooms.gym){box('gym',4,2.5,5,3,.18,blue);for(let i=0;i<3;i++)cyl('mat',2.7+i*1.2,2.3,.35,.12,green)}if(s.rooms.hybrid){box('hybrid',4,0,3.5,2.2,.18,hy);box('screen',4,0,1.6,.12,1.1,dark)}if(s.rooms.access)box('ramp',-6.3,3.8,2.2,1.3,.15,ramp);for(let i=0;i<Math.min(s.staff.length,5);i++)cyl('person',-5+i*2,4.3,.28,.9,i%2?blue:pink)}function setup(){let canvas=$('c'),engine=new B.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});g=new B.Scene(engine);g.clearColor=B.Color4.FromHexString('#cfe9dfff');let cam=new B.ArcRotateCamera('cam',-Math.PI/2.4,1.02,24,new B.Vector3(0,0,0),g);cam.lowerRadiusLimit=14;cam.upperRadiusLimit=34;cam.attachControl(canvas,true);cam.wheelPrecision=70;let light=new B.HemisphericLight('light',new B.Vector3(0,1,0),g);light.intensity=.95;let ground=B.MeshBuilder.CreateGround('ground',{width:60,height:60},g);ground.material=mat('ground','#9bd1bd');window.g=g;renderClinic();engine.runRenderLoop(()=>g.render());addEventListener('resize',()=>engine.resize())}setup();tab(document.querySelector('.nav button'),'overview');sync();if(fresh)setTimeout(onboarding,450);</script></body></html>
